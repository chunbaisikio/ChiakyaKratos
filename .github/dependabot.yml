version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
    ignore:
      # Astro check and typescript-eslint currently require TypeScript 6 or older.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # Keep Node API declarations aligned with the Node 24 production runtime.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
